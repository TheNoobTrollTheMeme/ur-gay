name: Offline robot arm code checks

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'ONE_CLICK_COMPETITION.sh'
      - '.github/workflows/offline-robot-check.yml'
  workflow_dispatch:

jobs:
  offline-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check script syntax
        run: python -m compileall -q scripts tests
      - name: Check launcher syntax
        run: bash -n ONE_CLICK_COMPETITION.sh
      - name: Run hardware-free unit tests
        run: python -m unittest discover -s tests -v
